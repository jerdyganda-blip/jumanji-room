<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jumanji TV</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game-config.js"></script>
<style>
  body { margin:0; background:black; overflow:hidden; font-family: sans-serif; }

  #startScreen {
    height:100vh; display:flex; justify-content:center; align-items:center; background:black;
  }
  #startBtn {
    font-size:28px; padding:20px 40px; background:#2d5a27; color:gold;
    border:3px solid gold; border-radius:10px; cursor:pointer;
  }

  #mainVideo {
    width:100vw; height:100vh; object-fit:cover; display:none;
  }

  #scanScreen {
    height:100vh; display:none; background:url('images/game-background.png') center/cover no-repeat;
    position:relative; flex-direction:column; justify-content:center; align-items:center;
    color:gold; text-align:center;
  }
  #scanText {
    font-size:36px; margin-bottom:30px; text-shadow:2px 2px 8px black;
    max-width:80%;
  }
  #qrImage {
    width:280px; height:280px; border:5px solid gold; border-radius:10px;
  }

  #trialScreen {
    height:100vh; display:none; background:url('images/game-background.png') center/cover no-repeat;
    position:relative; color:white;
  }
  #trialScreen::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); /* adjust 0.6 for more/less dimming */
    z-index: 0;
  }
  #instructionBox, #triviaBox {
    position:absolute; top:8%; left:50%; transform:translateX(-50%);
    width:85%; height:80%; font-size:22px; text-align:center; white-space:pre-wrap;
    text-shadow:3px 3px 10px black; line-height:1.4;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-weight: bold;
    color: #ffd700;
    z-index: 1;
    overflow-y: auto;
  }
  #triviaBox { display:none; }
  #timer {
    position:absolute; top:4%; right:4%; font-size:32px; color:red;
    font-weight:bold; text-shadow:2px 2px 6px black;
    z-index: 1;
  }

  #victoryText {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    display:none; justify-content:center; align-items:center;
    background:black; color:gold; font-size:48px; text-align:center;
  }
</style>
</head>
<body>

<div id="startScreen">
  <button id="startBtn">▶ ENTER THE JUNGLE</button>
</div>

<video id="mainVideo" src="video/intro-video.mp4"></video>

<div id="scanScreen">
  <p id="scanText">Welcome to Jumanji. Scan the code below to escape.</p>
  <img id="qrImage" src="images/qr-code.png" alt="QR Code">
</div>

<div id="trialScreen">
  <div id="timer">07:00</div>
  <div id="instructionBox"></div>
  <div id="triviaBox"></div>
</div>

<div id="victoryText">YOU ESCAPED THE JUNGLE!</div>

<audio id="introVO" src="audio/intro-voiceover.m4a"></audio>
<audio id="trial1VO" src="audio/trial1-voiceover.mp3"></audio>
<audio id="trial2VO" src="audio/trial2-voiceover.mp3"></audio>
<audio id="triviaVO" src="audio/trivia-question-voiceover.mp3"></audio>
<audio id="trial3VO" src="audio/trial3-voiceover.mp3"></audio>
<audio id="victoryVO" src="audio/victory-voiceover.mp3"></audio>
<audio id="drumsBG" src="audio/drums-bg.mp3" loop></audio>

<script>
  const startBtn = document.getElementById('startBtn');
  const startScreen = document.getElementById('startScreen');
  const mainVideo = document.getElementById('mainVideo');
  const scanScreen = document.getElementById('scanScreen');
  const trialScreen = document.getElementById('trialScreen');
  const instructionBox = document.getElementById('instructionBox');
  const triviaBox = document.getElementById('triviaBox');
  const timerEl = document.getElementById('timer');
  const victoryText = document.getElementById('victoryText');

  const introVO = document.getElementById('introVO');
  const trial1VO = document.getElementById('trial1VO');
  const trial2VO = document.getElementById('trial2VO');
  const triviaVO = document.getElementById('triviaVO');
  const trial3VO = document.getElementById('trial3VO');
  const victoryVO = document.getElementById('victoryVO');
  const drumsBG = document.getElementById('drumsBG');

  let currentStage = null;
  let fadeStarted = false;
  timerEl.textContent = String(GAME.timeLimitMinutes).padStart(2,'0') + ":00";

  // ---------- Typewriter effect synced to voiceover duration ----------
  function typeText(element, text, durationMs) {
    element.textContent = "";
    const chars = text.split("");
    const interval = durationMs / chars.length;
    let i = 0;
    const timer = setInterval(() => {
      element.textContent += chars[i];
      i++;
      if (i >= chars.length) clearInterval(timer);
    }, interval);
  }

  function playVoiceoverWithTypedText(audioEl, textEl, text) {
    textEl.textContent = "";
    function startTyping() {
      const durationMs = (audioEl.duration || 10) * 1000;
      typeText(textEl, text, durationMs);
    }
    if (audioEl.readyState >= 1) {
      startTyping();
    } else {
      audioEl.addEventListener('loadedmetadata', startTyping, { once: true });
    }
    audioEl.currentTime = 0;
    audioEl.play().catch(err => console.log("VO error:", err));
  }

  function fadeVideoVolume(from, to, durationMs) {
    const steps = 50;
    const stepTime = durationMs / steps;
    const volumeStep = (to - from) / steps;
    let currentStep = 0;
    const fadeInterval = setInterval(() => {
      currentStep++;
      mainVideo.volume = Math.min(from + (volumeStep * currentStep), to);
      if (currentStep >= steps) clearInterval(fadeInterval);
    }, stepTime);
  }

  // ---------- Intro sequence ----------
  function endIntroSequence() {
    mainVideo.style.display = 'none';
    scanScreen.style.display = 'flex';
    drumsBG.volume = 0.8;
    drumsBG.play().catch(err => console.log("Drums error:", err));
  }

  startBtn.addEventListener('click', () => {
    document.documentElement.requestFullscreen();

    startScreen.style.display = 'none';
    mainVideo.style.display = 'block';
    mainVideo.currentTime = 0;

    mainVideo.volume = 0.1;
    introVO.volume = 1.0;

    mainVideo.play().catch(err => console.log("Video error:", err));
    introVO.play().catch(err => console.log("Voiceover error:", err));

    fadeStarted = false;
    introVO.addEventListener('timeupdate', () => {
      if (introVO.duration && (introVO.duration - introVO.currentTime) <= 10 && !fadeStarted) {
        fadeStarted = true;
        fadeVideoVolume(0.1, 0.6, 10000);
      }
    });

    mainVideo.onended = endIntroSequence;

    mainVideo.addEventListener('timeupdate', () => {
      if (mainVideo.duration && (mainVideo.duration - mainVideo.currentTime) <= 3 && !mainVideo.paused) {
        mainVideo.pause();
        endIntroSequence();
      }
    });
  });

  // ---------- Firebase listener ----------
  db.ref('game').on('value', (snapshot) => {
    const data = snapshot.val();
    console.log("Firebase data received:", data);
    if (!data) return;

    console.log("Current stage on TV:", currentStage, "| New stage from Firebase:", data.stage);

    if (data.stage && data.stage !== currentStage) {
      currentStage = data.stage;
      console.log("Stage changed! Calling handleStageChange with:", currentStage);
      handleStageChange(currentStage);
    }
  });

  function handleStageChange(stage) {
    if (stage === 'trial1') {
      pauseCountdown();
      scanScreen.style.display = 'none';
      trialScreen.style.display = 'block';
      triviaBox.style.display = 'none';
      instructionBox.style.display = 'block';
      playVoiceoverWithTypedText(trial1VO, instructionBox, GAME.trial1Text);

      trial1VO.onended = () => {
        resumeCountdown();
      };

    } else if (stage === 'trial2') {
      pauseCountdown();
      instructionBox.style.display = 'block';
      triviaBox.style.display = 'none';
      playVoiceoverWithTypedText(trial2VO, instructionBox, GAME.trial2Text);

      trial2VO.onended = () => {
        instructionBox.style.display = 'none';
        triviaBox.style.display = 'block';
        playVoiceoverWithTypedText(triviaVO, triviaBox, GAME.triviaText);

        triviaVO.onended = () => {
          resumeCountdown();
        };
      };

    } else if (stage === 'trial3') {
      pauseCountdown();
      triviaBox.style.display = 'none';
      instructionBox.style.display = 'block';
      playVoiceoverWithTypedText(trial3VO, instructionBox, GAME.trial3Text);

      trial3VO.onended = () => {
        resumeCountdown();
      };

    } else if (stage === 'escaped') {
      pauseCountdown();
      drumsBG.pause();
      trialScreen.style.display = 'none';

      mainVideo.style.display = 'block';
      mainVideo.currentTime = 0;
      mainVideo.volume = 0.3;
      victoryVO.volume = 1.0;

      mainVideo.play().catch(err => console.log("Video error:", err));
      victoryVO.play().catch(err => console.log("Victory VO error:", err));

      mainVideo.onended = () => {
        mainVideo.style.display = 'none';
        victoryText.style.display = 'flex';
      };
    }
  }

  let countdownInterval;
  let remainingMs = GAME.timeLimitMinutes * 60 * 1000;
  let timerRunning = false;

  function pauseCountdown() {
    clearInterval(countdownInterval);
    timerRunning = false;
  }

  function resumeCountdown() {
    if (timerRunning) return;
    timerRunning = true;
    countdownInterval = setInterval(() => {
      remainingMs -= 1000;
      if (remainingMs <= 0) {
        remainingMs = 0;
        clearInterval(countdownInterval);
        timerEl.textContent = "00:00";
        timerRunning = false;
        return;
      }
      const mins = Math.floor(remainingMs / 60000);
      const secs = Math.floor((remainingMs % 60000) / 1000);
      timerEl.textContent = String(mins).padStart(2,'0') + ":" + String(secs).padStart(2,'0');
    }, 1000);
  }
</script>

</body>
</html>
