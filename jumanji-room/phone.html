<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumanji Phone</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game-config.js"></script>
<style>
  body {
    margin:0; font-family:sans-serif; color:white;
    text-align:center; padding:30px 20px;
    background: url('images/phone-background.png') center/cover no-repeat;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 0;
  }
  #nameScreen, #codeScreen, #finalScreen, #escapedScreen {
    position: relative;
    z-index: 1;
  }
  input {
    font-size:20px; padding:12px; margin:10px 0; width:90%; max-width:300px;
    border-radius:8px; border:none;
  }
  .greenBtn {
    width:200px; cursor:pointer; margin-top:15px;
  }
  #feedback { margin-top:15px; font-size:18px; }
</style>
</head>
<body>

<div id="nameScreen">
  <h2>Welcome to Jumanji</h2>
  <p>Enter your team name to begin</p>
  <input type="text" id="teamNameInput" placeholder="Team name">
  <br>
  <img src="images/green-button.png" class="greenBtn" id="nameSubmitBtn" alt="Submit">
</div>

<div id="codeScreen" style="display:none;">
  <h2>Jumanji Code</h2>
  <p id="phoneInstruction" style="font-size:16px; white-space:pre-wrap; text-align:left;"></p>
  <input type="text" id="codeInput" placeholder="Enter the code here">
  <br>
  <img src="images/green-button.png" class="greenBtn" id="codeSubmitBtn" alt="Submit">
  <p id="feedback"></p>
</div>

<div id="finalScreen" style="display:none;">
  <h2>Found the Keycard?</h2>
  <p>Tap the button once you've found it.</p>
  <img src="images/green-button.png" class="greenBtn" id="finalSubmitBtn" alt="Submit">
</div>

<div id="escapedScreen" style="display:none;">
  <h2>You Escaped!</h2>
  <p>Congratulations, survivor.</p>
</div>

<script>
  const nameScreen = document.getElementById('nameScreen');
  const codeScreen = document.getElementById('codeScreen');
  const finalScreen = document.getElementById('finalScreen');
  const escapedScreen = document.getElementById('escapedScreen');

  const teamNameInput = document.getElementById('teamNameInput');
  const nameSubmitBtn = document.getElementById('nameSubmitBtn');
  const codeInput = document.getElementById('codeInput');
  const codeSubmitBtn = document.getElementById('codeSubmitBtn');
  const finalSubmitBtn = document.getElementById('finalSubmitBtn');
  const feedback = document.getElementById('feedback');

  let currentStage = null;

  nameSubmitBtn.addEventListener('click', () => {
    const name = teamNameInput.value.trim();
    if (!name) {
      alert("Please enter your team name");
      return;
    }
    db.ref('game').set({
      teamName: name,
      stage: 'trial1',
      startTime: Date.now()
    });
  });

  db.ref('game/stage').on('value', (snapshot) => {
    currentStage = snapshot.val();
    renderUI();
  });

  const phoneInstruction = document.getElementById('phoneInstruction');

  function renderUI() {
    nameScreen.style.display = 'none';
    codeScreen.style.display = 'none';
    finalScreen.style.display = 'none';
    escapedScreen.style.display = 'none';
    feedback.textContent = '';
    codeInput.value = '';

    if (!currentStage) {
      nameScreen.style.display = 'block';
    } else if (currentStage === 'trial1') {
      codeScreen.style.display = 'block';
      phoneInstruction.textContent = GAME.trial1Text;
    } else if (currentStage === 'trial2') {
      codeScreen.style.display = 'block';
      phoneInstruction.textContent = GAME.trial2Text;
    } else if (currentStage === 'trial3') {
      finalScreen.style.display = 'block';
    } else if (currentStage === 'escaped') {
      escapedScreen.style.display = 'block';
    }
  }

  codeSubmitBtn.addEventListener('click', () => {
    const code = codeInput.value.trim(); // NOTE: no uppercase conversion, case-sensitive

    if (currentStage === 'trial1') {
      if (code === GAME.trial1Code) {
        feedback.textContent = "Correct! Move on to the next trial.";
        db.ref('game/stage').set('trial2');
      } else {
        feedback.textContent = "Incorrect. Try again.";
      }
    } else if (currentStage === 'trial2') {
      if (code === GAME.trial2Code) {
        feedback.textContent = "Correct! Final trial ahead.";
        db.ref('game/stage').set('trial3');
      } else {
        feedback.textContent = "Incorrect. Try again.";
      }
    }
  });

  finalSubmitBtn.addEventListener('click', () => {
    db.ref('game/stage').set('escaped');
  });
</script>

</body>
</html>
